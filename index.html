<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>금형 QR 통합관리 | 태진다이텍</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#0e1218; --panel:#171d26; --panel2:#1e2632; --line:#2b3542;
  --tx:#e7edf5; --mut:#8a99ad; --dim:#5d6b7d;
  --amber:#f0a132; --teal:#2ec4a6; --warn:#ff8a45; --bad:#ff4d5e; --steel:#5b8dd6;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2431 0%, transparent 60%),
    var(--bg);
  color:var(--tx);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.5;
  padding:0 0 96px; min-height:100vh;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* ── header ── */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(14,18,24,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:10px;padding:12px 0}
.logo{
  width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(145deg,var(--amber),#c97b12);
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#231603;
  font-family:"JetBrains Mono",monospace;
}
.hd h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.2px}
.hd .sub{font-size:11px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
.who{
  margin-left:auto;background:var(--panel2);border:1px solid var(--line);
  color:var(--tx);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.who .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.who.none .dot{background:var(--bad)}

/* ── scan hero ── */
.hero{padding:20px 0 8px}
.scanbtn{
  width:100%;border:0;cursor:pointer;color:#1a1204;
  background:linear-gradient(160deg,#ffc25c,var(--amber) 55%,#d4870f);
  border-radius:18px;padding:22px 18px;
  display:flex;align-items:center;gap:16px;
  box-shadow:0 10px 30px -12px rgba(240,161,50,.6);
}
.scanbtn:active{transform:translateY(1px)}
.scanbtn svg{flex:0 0 42px}
.scanbtn b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px}
.scanbtn span{display:block;font-size:12.5px;opacity:.72;font-weight:600;margin-top:2px}
.manual{display:flex;gap:8px;margin-top:12px}
.manual input{
  flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);
  border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;letter-spacing:1px;
  font-family:"JetBrains Mono",monospace;text-transform:uppercase;
}
.manual input::placeholder{letter-spacing:0;font-family:Pretendard;font-weight:500;text-transform:none;color:var(--dim)}
.manual button{
  background:var(--panel2);border:1px solid var(--line);color:var(--tx);
  border-radius:12px;padding:0 18px;font-weight:700;font-size:14px;cursor:pointer;
}

/* ── reader ── */
#readerBox{display:none;margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;position:relative}
#reader{width:100%}
#readerBox.on{display:block}
.readclose{
  position:absolute;right:10px;top:10px;z-index:5;background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer
}

/* ── mold card ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.plate{
  padding:16px 16px 14px;
  background:linear-gradient(180deg,#212b38,#1a222d);
  border-bottom:1px solid var(--line);
}
.plate .eyebrow{font-size:10.5px;letter-spacing:2.4px;color:var(--amber);font-weight:800;text-transform:uppercase}
.plate .code{
  font-family:"JetBrains Mono",monospace;font-weight:800;font-size:34px;line-height:1.1;
  letter-spacing:1px;margin:3px 0 4px;
  text-shadow:0 1px 0 #000,0 -1px 0 rgba(255,255,255,.08);
}
.plate .pn{font-size:14px;color:var(--mut);font-weight:600}
.plate .pn b{color:var(--tx)}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.spec i{
  font-style:normal;font-size:11.5px;background:#0f151d;border:1px solid var(--line);
  color:var(--mut);border-radius:7px;padding:4px 8px;font-weight:600
}

/* signal strip */
.signals{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.sig{background:var(--panel2);padding:11px 4px;text-align:center;cursor:pointer;border-top:3px solid transparent}
.sig .lb{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.2px}
.sig .vl{font-size:13.5px;font-weight:800;margin-top:3px;white-space:nowrap}
.sig.ok{border-top-color:var(--teal)} .sig.ok .vl{color:var(--teal)}
.sig.wa{border-top-color:var(--warn)} .sig.wa .vl{color:var(--warn)}
.sig.bd{border-top-color:var(--bad)} .sig.bd .vl{color:var(--bad)}
.sig.nu{border-top-color:var(--dim)} .sig.nu .vl{color:var(--mut)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel2);border-bottom:1px solid var(--line)}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  padding:12px 2px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap
}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber);background:var(--panel)}
.pane{display:none;padding:14px 14px 16px}
.pane.on{display:block}

/* rows */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #222b36;font-size:14px}
.kv:last-of-type{border-bottom:0}
.kv .k{color:var(--mut);font-weight:600;flex:0 0 auto}
.kv .v{font-weight:700;text-align:right;word-break:break-all}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:800}
.b-ok{background:rgba(46,196,166,.15);color:var(--teal)}
.b-wa{background:rgba(255,138,69,.15);color:var(--warn)}
.b-bd{background:rgba(255,77,94,.15);color:var(--bad)}
.b-nu{background:#232c38;color:var(--mut)}

.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{
  flex:1;min-width:118px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);
  border-radius:11px;padding:13px 10px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit
}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1204}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}

.hist{margin-top:14px}
.hist h4{font-size:12px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin:0 0 8px;font-weight:800}
.item{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--steel);border-radius:10px;padding:10px 12px;margin-bottom:7px}
.item.w{border-left-color:var(--teal)} .item.r{border-left-color:var(--warn)}
.item.c{border-left-color:var(--steel)}
/* 정기점검 임박 현황 버튼 */
.duebtn{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
  font-family:inherit;color:var(--txt);font-size:13.5px;font-weight:700;text-align:left}
.duebtn .ic{font-size:17px;line-height:1}
.duebtn .gr{flex:1;min-width:0}
.duebtn .sub2{display:block;font-size:11.5px;color:var(--dim);font-weight:600;margin-top:2px}
.duebtn .cnt{display:flex;gap:5px;flex:0 0 auto}
.item .t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700}
.item .d{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.45}
.empty{text-align:center;color:var(--dim);padding:22px 10px;font-size:13.5px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet .pn2{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;
}
.sheet h3{margin:2px 0 14px;font-size:17px;font-weight:800}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;background:#0f151d;border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:12px;font-size:15px;font-family:inherit
}
.fld textarea{min-height:74px;resize:vertical}
.grip{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{
  background:#0f151d;border:1px solid var(--line);color:var(--mut);border-radius:9px;
  padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit
}
.chips button.on{background:var(--amber);border-color:var(--amber);color:#1a1204}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:99;
  background:#0b0f14;border:1px solid var(--line);border-radius:12px;
  padding:12px 18px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;
  box-shadow:0 12px 34px -10px #000;max-width:92vw;text-align:center
}
.toast.on{opacity:1;bottom:34px}
.toast.ok{border-color:var(--teal);color:var(--teal)}
.toast.err{border-color:var(--bad);color:var(--bad)}

.recent{margin-top:18px}
.recent h4{font-size:12px;color:var(--dim);letter-spacing:1.2px;margin:0 0 8px;font-weight:800;text-transform:uppercase}
.rchips{display:flex;gap:7px;flex-wrap:wrap}
.rchips button{
  background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:9px;
  padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:"JetBrains Mono",monospace
}
.foot{text-align:center;color:var(--dim);font-size:11.5px;padding:24px 0 0;letter-spacing:.3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="logo">TJ</div>
    <div>
      <h1>금형 QR 통합관리</h1>
      <div class="sub">위치 · 세척 · 수리</div>
    </div>
    <button class="who none" id="whoBtn"><span class="dot"></span><span id="whoTx">작업자 선택</span></button>
  </div>
</header>

<div class="wrap">

  <div class="hero" id="hero">
    <button class="scanbtn" id="scanBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
        <path d="M7 12h10" stroke-width="2.4"/>
      </svg>
      <span>
        <b>금형 QR 스캔</b>
        <span>금형 카드의 QR을 비추세요</span>
      </span>
    </button>

    <div class="manual">
      <input id="mnIn" placeholder="재번 직접 입력 (예: 0DHA038)" autocomplete="off">
      <button id="mnGo">조회</button>
    </div>

    <button class="duebtn" id="dueBtn">
      <span class="ic">🗓️</span>
      <span class="gr">정기점검 임박 현황
        <span class="sub2" id="dueSub">탭하면 점검 기한이 임박·초과된 금형을 확인합니다</span>
      </span>
      <span class="cnt" id="dueCnt"></span>
    </button>

    <div id="readerBox">
      <button class="readclose" id="readClose">닫기</button>
      <div id="reader"></div>
    </div>

    <div class="recent" id="recentBox" style="display:none">
      <h4>최근 조회</h4>
      <div class="rchips" id="rchips"></div>
    </div>
  </div>

  <div id="result"></div>

  <div class="foot">태진다이텍 품질관리팀 · v1.0</div>
</div>

<!-- 시트 -->
<div class="sheet" id="sheet">
  <div class="bd" data-close></div>
  <div class="pn2">
    <div class="grip"></div>
    <h3 id="shTitle">제목</h3>
    <div id="shBody"></div>
    <div class="acts" style="margin-top:16px">
      <button class="btn ghost" data-close>취소</button>
      <button class="btn pri" id="shSave">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════ 설정 ══════════ */
const SB  = 'https://ebthltdmxpzlkfwvdloz.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVidGhsdGRteHB6bGtmd3ZkbG96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTcxNTQsImV4cCI6MjA5MDczMzE1NH0.bXqNpOtDMCFjuZROrIDm_3o0kHmNESs7EHOgGnFCxAM';
const WASH_CYCLE_DAYS  = 90;      // 세척 주기(일)
const WASH_CYCLE_SHOTS = 300000;  // 세척 주기(타발수)
const CHECK_CYCLE_DAYS = 180;     // 금형 정기점검 주기(일) — 기본값
const CHECK_WARN_DAYS  = 30;      // 점검 임박 경고 기준(일)

const H = {apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json'};
const api = (p,o={}) => fetch(SB+'/rest/v1/'+p, {...o, headers:{...H, ...(o.headers||{})}});
const $  = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const nf = n => (Number(n)||0).toLocaleString('ko-KR');
const days = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);

let ST = { user:localStorage.getItem('mqr_user')||'', users:[], racks:[], machines:[],
           mold:null, wash:null, check:null, recent:JSON.parse(localStorage.getItem('mqr_recent')||'[]') };

function toast(msg, kind='ok'){
  const t=$('#toast'); t.textContent=msg; t.className='toast on '+kind;
  clearTimeout(t._x); t._x=setTimeout(()=>t.className='toast '+kind, 2400);
}

/* ══════════ 기준정보 ══════════ */
async function boot(){
  try{
    const [u,c] = await Promise.all([
      api('kv_store?key=eq.user_pins&select=value').then(r=>r.json()),
      api('mold_config?select=k,v').then(r=>r.json())
    ]);
    ST.users = (u[0]?.value||[]).map(x=>x.name).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko'));
    const cf = Object.fromEntries((c||[]).map(x=>[x.k, (x.v||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean)]));
    ST.racks = cf.racks||[]; ST.machines = cf.machines||[];
  }catch(e){ toast('기준정보 로딩 실패 — 오프라인 확인','err'); }
  paintUser(); paintRecent();
}
function paintUser(){
  const b=$('#whoBtn'); $('#whoTx').textContent = ST.user||'작업자 선택';
  b.classList.toggle('none', !ST.user);
}
$('#whoBtn').onclick = ()=>{
  openSheet('작업자 선택', `<div class="chips" id="uch">${
    ST.users.map(n=>`<button data-n="${esc(n)}" class="${n===ST.user?'on':''}">${esc(n)}</button>`).join('')
    || '<div class="empty">사용자 목록을 불러오지 못했습니다.</div>'}</div>`, null);
  $('#shSave').style.display='none';
  $('#uch')?.addEventListener('click',e=>{
    const b2=e.target.closest('button[data-n]'); if(!b2) return;
    ST.user=b2.dataset.n; localStorage.setItem('mqr_user',ST.user); paintUser(); closeSheet();
    toast(ST.user+' 님으로 설정');
  });
};

/* ══════════ QR 파싱 ══════════ */
function parseQR(txt){
  if(!txt) return null;
  const t = txt.trim();
  if(/^https?:\/\//i.test(t)){
    try{ const u=new URL(t);
      const mn=(u.searchParams.get('die')||u.searchParams.get('mn')||'').toUpperCase();
      return mn ? {mn} : null;
    }catch(_){}
  }
  // 금형카드 텍스트형: 재번/재질/두께/폭/피치/품번/고객/자산
  const g = k => (t.match(new RegExp(k+'\\s*[:：]\\s*([^\\n\\r]+)'))||[])[1]?.trim()||'';
  const mn = g('재번');
  if(mn) return {mn:mn.toUpperCase(), pn:g('품번'), mat:g('재질'), thk:g('두께'),
                 wid:g('폭'), pitch:g('피치'), cust:g('고객'), asset:g('자산')};
  if(/^[A-Za-z0-9\-()]{3,24}$/.test(t)) return {mn:t.toUpperCase()};
  return null;
}

/* ══════════ 스캐너 ══════════ */
let scanner=null;
$('#scanBtn').onclick = async ()=>{
  if(!ST.user){ toast('먼저 작업자를 선택하세요','err'); $('#whoBtn').click(); return; }
  $('#readerBox').classList.add('on');
  try{
    scanner = new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:240,height:240}},
      txt=>{ const q=parseQR(txt);
        if(!q){ toast('QR을 인식했지만 재번이 없습니다','err'); return; }
        stopScan(); load(q.mn, q);
      }, ()=>{});
  }catch(e){ toast('카메라를 열 수 없습니다 (HTTPS·권한 확인)','err'); $('#readerBox').classList.remove('on'); }
};
function stopScan(){ if(scanner){ scanner.stop().catch(()=>{}).then(()=>{scanner.clear();scanner=null;}); } $('#readerBox').classList.remove('on'); }
$('#readClose').onclick = stopScan;
$('#mnGo').onclick = ()=>{ const v=$('#mnIn').value.trim().toUpperCase(); if(v) load(v); };
$('#mnIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#mnGo').click(); });

/* ══════════ 조회 ══════════ */
const NORM = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const CORE = s => NORM(String(s||'').replace(/\(.*?\)/g,''));

// 재번 표기 차이 흡수: 정확 → 기호무시 → 괄호제거 → 접미(A/_2) 차이
async function findMold(mn){
  let r = await api(`mold_master?mn=eq.${encodeURIComponent(mn)}&select=*`).then(x=>x.json());
  if(r.length) return r[0];
  const all = await api('mold_master?select=pn,mn,loc,rack,updated_at&limit=2000').then(x=>x.json());
  const c = CORE(mn), n = NORM(mn);
  let hit = all.find(m=>NORM(m.mn)===n) || all.find(m=>m.mn && CORE(m.mn)===c);
  if(!hit && c) hit = all.find(m=>m.mn && (CORE(m.mn)===c || NORM(m.mn).includes(c) || c.includes(NORM(m.mn)))
                                && Math.abs(NORM(m.mn).length - c.length) <= 4);
  return hit || null;
}

async function load(mn, meta){
  toast('조회 중…');
  try{
    const m = await findMold(mn);
    if(!m){ newMold(mn, meta||{}); return; }
    if(m.mn !== mn) toast(`대장 재번 ${m.mn} 로 매칭`);
    mn = m.mn;
    const [rep, kv, ck] = await Promise.all([
      api(`repair_data?mold_code=eq.${encodeURIComponent(mn)}&select=*&order=request_date.desc&limit=30`).then(r=>r.json()),
      api('kv_store?key=eq.mold_wash_v1&select=value').then(r=>r.json()),
      api('kv_store?key=eq.mold_check_v1&select=value').then(r=>r.json()).catch(()=>[])
    ]);
    ST.wash = kv[0]?.value || {base:{},hist:[]};
    ST.check = ck[0]?.value || {base:{},hist:[]};
    const wh = (ST.wash.hist||[]).filter(h=>h.금형번호===mn || h.품번===m.pn)
                 .sort((a,b)=>String(b.세척일).localeCompare(String(a.세척일)));
    const ch = (ST.check.hist||[]).filter(h=>h.금형번호===mn)
                 .sort((a,b)=>String(b.점검일).localeCompare(String(a.점검일)));
    ST.mold = {mn, pn:m.pn, loc:m.loc||'', rack:m.rack||'', at:m.updated_at,
               base:ST.wash.base?.[m.pn]||null, wash:wh, rep,
               chk:ch, cbase:ST.check.base?.[mn]||null};
    pushRecent(mn); render();
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){ toast('조회 실패 — 네트워크 확인','err'); }
}
function pushRecent(mn){
  ST.recent = [mn, ...ST.recent.filter(x=>x!==mn)].slice(0,6);
  localStorage.setItem('mqr_recent', JSON.stringify(ST.recent)); paintRecent();
}
function paintRecent(){
  if(!ST.recent.length) return;
  $('#recentBox').style.display='block';
  $('#rchips').innerHTML = ST.recent.map(m=>`<button data-m="${esc(m)}">${esc(m)}</button>`).join('');
  $('#rchips').onclick = e=>{ const b=e.target.closest('button[data-m]'); if(b) load(b.dataset.m); };
}

/* ══════════ 상태 계산 ══════════ */
function washState(M){
  const last = M.wash[0]?.세척일 || M.base?.일자 || null;
  if(!last) return {cls:'nu', tx:'미등록', last:null, d:null};
  const el = days(last, today());
  const left = WASH_CYCLE_DAYS - el;
  if(left < 0)  return {cls:'bd', tx:`${-left}일 초과`, last, d:left};
  if(left <= 14) return {cls:'wa', tx:`D-${left}`, last, d:left};
  return {cls:'ok', tx:`D-${left}`, last, d:left};
}
function repState(M){
  const open = M.rep.filter(r=>r.stage && r.stage!=='입고완료');
  if(open.length) return {cls:'wa', tx:`진행 ${open.length}건`};
  if(M.rep.length) return {cls:'ok', tx:`이력 ${M.rep.length}건`};
  return {cls:'nu', tx:'이력 없음'};
}
function locState(M){
  if(!M.loc) return {cls:'nu', tx:'미지정'};
  return /보관/.test(M.loc) ? {cls:'ok', tx:M.rack||'보관함'} : {cls:'wa', tx:'장착중'};
}

/* ── 정기점검 D-day 계산 ──
   ① 점검 등록 이력  ② 없으면 수리이력의 '정기보전' 건을 최종 점검일로 간주 */
function checkCycle(M){ return Number(M?.cbase?.주기) || CHECK_CYCLE_DAYS; }
function lastCheck(M){
  if(M.chk?.length) return {dt:M.chk[0].점검일, src:'점검이력'};
  if(M.cbase?.일자) return {dt:M.cbase.일자, src:'점검이력'};
  const pm = (M.rep||[]).filter(r=>/정기보전|정기점검|보전/.test(r.repair_type||''))
              .sort((a,b)=>String(b.request_date).localeCompare(String(a.request_date)))[0];
  if(pm?.request_date) return {dt:String(pm.request_date).slice(0,10), src:'수리이력(정기보전)'};
  return {dt:null, src:null};
}
function checkState(M){
  const L = lastCheck(M), cyc = checkCycle(M);
  if(!L.dt) return {cls:'nu', tx:'미등록', last:null, src:null, cyc, d:null, due:null};
  const left = cyc - days(L.dt, today());
  const due  = new Date(new Date(L.dt).getTime() + cyc*86400000).toISOString().slice(0,10);
  const base = {last:L.dt, src:L.src, cyc, d:left, due};
  if(left < 0)                return {cls:'bd', tx:`${-left}일 초과`, ...base};
  if(left <= CHECK_WARN_DAYS) return {cls:'wa', tx:`D-${left}`, ...base};
  return {cls:'ok', tx:`D-${left}`, ...base};
}

async function saveNewMold(mn){
  if(!guard()) return;
  const pn = $('#n_pn').value.trim(), rack = $('#n_rack').value;
  if(!pn){ toast('품번을 입력하세요','err'); return; }
  try{
    let r = await api('mold_master', {method:'POST', headers:{Prefer:'return=minimal'},
      body:JSON.stringify({pn, mn, loc:'보관함', rack, mismatch:false, updated_at:new Date().toISOString()})});
    if(!r.ok) throw 0;
    await api('mold_move_log', {method:'POST', headers:{Prefer:'return=minimal'},
      body:JSON.stringify({pn, mn, loc:'보관함', rack, kind:'신규등록',
        note:$('#n_note').value||'', moved_by:ST.user, is_4m:false})});
    closeSheet(); $('#shSave').textContent='저장';
    toast(`${mn} 대장 등록 완료`); load(mn);
  }catch(e){ toast('등록 실패 — 품번 중복 여부 확인','err'); }
}

/* ══════════ 저장 ══════════ */
async function saveMove(kind, loc, rack, note){
  const M=ST.mold;
  try{
    let r = await api('mold_move_log', {method:'POST', headers:{Prefer:'return=minimal'},
      body:JSON.stringify({pn:M.pn, mn:M.mn, loc, rack, kind, note:note||'', moved_by:ST.user, is_4m:false})});
    if(!r.ok) throw 0;
    r = await api(`mold_master?pn=eq.${encodeURIComponent(M.pn)}&mn=eq.${encodeURIComponent(M.mn)}`,
      {method:'PATCH', headers:{Prefer:'return=minimal'},
       body:JSON.stringify({loc, rack, updated_at:new Date().toISOString()})});
    if(!r.ok) throw 0;
    closeSheet(); toast(`${kind} 등록 완료 — ${loc}`); load(M.mn);
  }catch(e){ toast('저장 실패 — 다시 시도하세요','err'); }
}

async function saveWash(){
  const M=ST.mold;
  const dt=$('#w_dt').value, shot=Number($('#w_shot').value)||0;
  if(!dt){ toast('세척일을 입력하세요','err'); return; }
  try{
    const kv = await api('kv_store?key=eq.mold_wash_v1&select=value').then(r=>r.json());
    const W = kv[0]?.value || {base:{}, hist:[]};
    const prev = W.base?.[M.pn]?.타발수 || 0;
    W.hist = W.hist||[]; W.base = W.base||{};
    W.hist.push({
      id:Date.now(), 구분:'현장 QR 세척', 품번:M.pn, 금형번호:M.mn,
      세척일:dt, 실시자:ST.user, 타발수:shot, 기준타발수:shot,
      사용타발수:Math.max(0, shot-prev), 판정:$('#w_jd').value,
      방청유:$('#w_oil').value, 특이:$('#w_note').value||'', 생산완료일:dt
    });
    W.base[M.pn] = {일자:dt, 타발수:shot};
    const r = await api('kv_store?key=eq.mold_wash_v1', {method:'PATCH', headers:{Prefer:'return=minimal'},
      body:JSON.stringify({value:W, updated_at:new Date().toISOString()})});
    if(!r.ok) throw 0;
    closeSheet(); toast('세척 등록 완료'); load(M.mn);
  }catch(e){ toast('저장 실패 — 다시 시도하세요','err'); }
}

/* kv_store 안전 저장 — 행이 없으면 새로 만든다 */
async function kvSave(key, value){
  const cur = await api(`kv_store?key=eq.${key}&select=key`).then(r=>r.json()).catch(()=>[]);
  const body = JSON.stringify(cur.length ? {value, updated_at:new Date().toISOString()}
                                         : {key, value, updated_at:new Date().toISOString()});
  return api(cur.length ? `kv_store?key=eq.${key}` : 'kv_store',
             {method: cur.length ? 'PATCH' : 'POST', headers:{Prefer:'return=minimal'}, body});
}

async function saveCheck(){
  const M=ST.mold;
  const dt=$('#c_dt').value, cyc=Math.max(1, Number($('#c_cyc').value)||CHECK_CYCLE_DAYS);
  if(!dt){ toast('점검일을 입력하세요','err'); return; }
  try{
    const kv = await api('kv_store?key=eq.mold_check_v1&select=value').then(r=>r.json()).catch(()=>[]);
    const K = kv[0]?.value || {base:{}, hist:[]};
    K.hist = K.hist||[]; K.base = K.base||{};
    K.hist.push({
      id:Date.now(), 품번:M.pn, 금형번호:M.mn, 점검일:dt, 주기:cyc,
      점검자:$('#c_by').value||ST.user, 판정:$('#c_jd').value,
      타발수:Number($('#c_shot').value)||0, 특이:$('#c_note').value||''
    });
    K.base[M.mn] = {일자:dt, 주기:cyc};
    const r = await kvSave('mold_check_v1', K);
    if(!r.ok) throw 0;
    closeSheet();
    const due = new Date(new Date(dt).getTime()+cyc*86400000).toISOString().slice(0,10);
    toast(`정기점검 등록 완료 — 다음 ${due}`);
    load(M.mn);
  }catch(e){ toast('저장 실패 — 다시 시도하세요','err'); }
}

async function saveRep(){

    const r = await api('repair_data', {method:'POST', headers:{Prefer:'return=minimal'},
      body:JSON.stringify({

        requester:ST.user, assignee:$('#r_as').value, repair_type:$('#r_ty').value,

/* ══════════ 정기점검 임박 현황 ══════════ */
let DUE_CACHE=null;
async function buildDue(force){
  if(DUE_CACHE && !force) return DUE_CACHE;
  const [ms, ck] = await Promise.all([
    api('mold_master?select=mn,pn,loc,rack&limit=3000').then(r=>r.json()),
    api('kv_store?key=eq.mold_check_v1&select=value').then(r=>r.json()).catch(()=>[])
  ]);
  const K = ck[0]?.value || {base:{},hist:[]};
  const rows = (ms||[]).filter(m=>m.mn).map(m=>{
    const b = K.base?.[m.mn];
    if(!b?.일자) return {mn:m.mn, pn:m.pn, loc:m.loc, d:null, cls:'nu', last:null, due:null};
    const cyc = Number(b.주기)||CHECK_CYCLE_DAYS;
    const left = cyc - days(b.일자, today());
    const due = new Date(new Date(b.일자).getTime()+cyc*86400000).toISOString().slice(0,10);
    return {mn:m.mn, pn:m.pn, loc:m.loc, d:left, last:b.일자, due,
            cls: left<0?'bd' : left<=CHECK_WARN_DAYS?'wa' : 'ok'};
  });
  DUE_CACHE = {
    over: rows.filter(r=>r.cls==='bd').sort((a,b)=>a.d-b.d),
    soon: rows.filter(r=>r.cls==='wa').sort((a,b)=>a.d-b.d),
    none: rows.filter(r=>r.cls==='nu'),
    ok:   rows.filter(r=>r.cls==='ok').sort((a,b)=>a.d-b.d),
    total: rows.length
  };
  return DUE_CACHE;
}
function dueRow(r){
  return `<div class="item ${r.cls==='bd'?'r':'c'}" data-mn="${esc(r.mn)}" style="cursor:pointer">
    <div class="t"><span class="mono">${esc(r.mn)}</span>
    <span class="badge b-${r.cls}">${r.d===null?'미등록':(r.d<0?`${-r.d}일 초과`:`D-${r.d}`)}</span></div>
    <div class="d">품번 ${esc(r.pn||'-')} · ${esc(r.loc||'위치 미지정')}${r.due?' · 예정 '+esc(r.due):''}</div></div>`;
}
async function paintDueBadge(){
  try{
    const D = await buildDue();
    const c = $('#dueCnt'), sub = $('#dueSub');
    c.innerHTML = `${D.over.length?`<span class="badge b-bd">초과 ${D.over.length}</span>`:''}`
                + `${D.soon.length?`<span class="badge b-wa">임박 ${D.soon.length}</span>`:''}`
                + `${(!D.over.length&&!D.soon.length)?`<span class="badge b-ok">이상 없음</span>`:''}`;
    sub.textContent = `대장 ${D.total}건 · 점검 미등록 ${D.none.length}건 · ${CHECK_WARN_DAYS}일 이내 임박 기준`;
  }catch(e){ $('#dueSub').textContent='현황을 불러오지 못했습니다 — 탭하여 재시도'; }
}
$('#dueBtn').onclick = async ()=>{
  openSheet('정기점검 임박 현황', '<div class="empty">불러오는 중…</div>', null);
  $('#shSave').style.display='none';
  try{
    const D = await buildDue(true);
    $('#shBody').innerHTML = `
      <div class="kv"><span class="k">기한 초과</span><span class="v"><span class="badge b-bd">${D.over.length}건</span></span></div>
      <div class="kv"><span class="k">임박 (D-${CHECK_WARN_DAYS} 이내)</span><span class="v"><span class="badge b-wa">${D.soon.length}건</span></span></div>
      <div class="kv"><span class="k">정상</span><span class="v"><span class="badge b-ok">${D.ok.length}건</span></span></div>
      <div class="kv"><span class="k">점검 미등록</span><span class="v"><span class="badge b-nu">${D.none.length}건</span></span></div>
      <div class="hist" id="dueList">
        <h4>기한 초과</h4>${D.over.length?D.over.map(dueRow).join(''):'<div class="empty">없습니다.</div>'}
        <h4 style="margin-top:14px">임박</h4>${D.soon.length?D.soon.map(dueRow).join(''):'<div class="empty">없습니다.</div>'}
        <h4 style="margin-top:14px">점검 미등록</h4>${D.none.length?D.none.slice(0,50).map(dueRow).join(''):'<div class="empty">없습니다.</div>'}
      </div>`;
    $('#dueList').onclick = e=>{
      const it = e.target.closest('[data-mn]'); if(!it) return;
      closeSheet(); load(it.dataset.mn);
    };
    paintDueBadge();
  }catch(e){ $('#shBody').innerHTML='<div class="empty">현황을 불러오지 못했습니다.</div>'; }
};

/* ══════════ 시작 ══════════ */
boot();
paintDueBadge();
const q = new URLSearchParams(location.search).get('die') || new URLSearchParams(location.search).get('mn');
if(q) setTimeout(()=>load(q.toUpperCase()), 400);
</script>
